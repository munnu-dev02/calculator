<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <label for="display" class="visually-hidden">Calculator display</label>
        <div id="history"></div>
        <button id="clearHistory">Clear History</button>
        <button id="themeToggle">☀️ Light Mode</button>
        <input type="text" id="display" readonly title="Calculator display" placeholder="0">

        <div class="buttons">
            <button>AC</button>
            <button>DEL</button>
            <button>%</button>
            <button>+/-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>+/-</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
